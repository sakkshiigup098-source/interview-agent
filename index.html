<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Interview Agent</title>
<style>
  :root{
    --ink:#0d1210;
    --paper:#f6f3ea;
    --line:#d8cdb0;
    --accent:#3a6b4f;
    --accent-dim:#e7ede4;
    --mono: "IBM Plex Mono", "SFMono-Regular", Consolas, monospace;
    --serif: "Iowan Old Style", "Georgia", serif;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    background:var(--paper);
    color:var(--ink);
    font-family:var(--serif);
    display:flex;
    flex-direction:column;
    min-height:100vh;
  }

  /* ---- header ---- */
  header{
    border-bottom:1px solid var(--line);
    padding:18px 20px 14px;
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    gap:12px;
  }
  header .mark{
    font-family:var(--mono);
    font-size:12px;
    letter-spacing:.12em;
    text-transform:uppercase;
    color:var(--accent);
  }
  header h1{
    font-size:20px;
    margin:2px 0 0;
    font-weight:600;
    letter-spacing:-0.01em;
  }
  #status{
    font-family:var(--mono);
    font-size:11px;
    color:#8a8272;
    text-align:right;
    white-space:nowrap;
  }
  #status.live{color:var(--accent);}
  #status .dot{
    display:inline-block;
    width:6px;height:6px;
    border-radius:50%;
    background:#b3ab93;
    margin-right:6px;
  }
  #status.live .dot{background:var(--accent);}

  /* ---- intake form ---- */
  #intake{
    max-width:640px;
    margin:36px auto;
    padding:0 20px;
    width:100%;
  }
  #intake p.lead{
    font-size:15px;
    line-height:1.6;
    color:#4a4636;
    margin:0 0 22px;
  }
  .field{margin-bottom:16px;}
  .field label{
    display:block;
    font-family:var(--mono);
    font-size:11px;
    text-transform:uppercase;
    letter-spacing:.08em;
    color:#6b6650;
    margin-bottom:6px;
  }
  .field input, .field textarea{
    width:100%;
    background:#fffdf7;
    border:1px solid var(--line);
    padding:11px 12px;
    font-family:var(--serif);
    font-size:15px;
    color:var(--ink);
    border-radius:2px;
    resize:vertical;
  }
  .field textarea{min-height:90px;}
  .field input:focus, .field textarea:focus{
    outline:none;
    border-color:var(--accent);
  }
  #intake button{
    font-family:var(--mono);
    font-size:12px;
    letter-spacing:.06em;
    text-transform:uppercase;
    background:var(--ink);
    color:var(--paper);
    border:none;
    padding:13px 22px;
    cursor:pointer;
    border-radius:2px;
  }
  #intake button:hover{background:var(--accent);}
  #intake button:disabled{opacity:.5;cursor:default;}
  #intakeError{
    font-family:var(--mono);
    font-size:12px;
    color:#a5432f;
    margin-top:10px;
    display:none;
  }

  /* ---- chat ---- */
  #chatWrap{
    display:none;
    flex:1;
    flex-direction:column;
    max-width:680px;
    width:100%;
    margin:0 auto;
    padding:0 20px;
  }
  #log{
    flex:1;
    overflow-y:auto;
    padding:28px 0 16px;
    display:flex;
    flex-direction:column;
    gap:18px;
  }
  .msg{
    max-width:88%;
    line-height:1.55;
    font-size:15.5px;
  }
  .msg .who{
    font-family:var(--mono);
    font-size:10px;
    text-transform:uppercase;
    letter-spacing:.1em;
    color:#8a8272;
    margin-bottom:5px;
  }
  .msg.agent{align-self:flex-start;}
  .msg.agent .bubble{
    background:#fffdf7;
    border:1px solid var(--line);
    border-left:3px solid var(--accent);
    padding:12px 14px;
    border-radius:2px;
  }
  .msg.me{align-self:flex-end;}
  .msg.me .who{text-align:right;}
  .msg.me .bubble{
    background:var(--ink);
    color:var(--paper);
    padding:12px 14px;
    border-radius:2px;
  }
  .msg.sys .bubble{
    font-family:var(--mono);
    font-size:12px;
    color:#a5432f;
    background:#fbeee9;
    border:1px solid #e6c9bd;
    padding:10px 12px;
    border-radius:2px;
  }
  .typing{
    font-family:var(--mono);
    font-size:12px;
    color:#8a8272;
    display:flex;
    align-items:center;
    gap:6px;
  }
  .typing .dots span{
    display:inline-block;
    width:4px;height:4px;
    border-radius:50%;
    background:#8a8272;
    margin-right:3px;
    animation:blink 1.2s infinite;
  }
  .typing .dots span:nth-child(2){animation-delay:.2s;}
  .typing .dots span:nth-child(3){animation-delay:.4s;}
  @keyframes blink{
    0%,80%,100%{opacity:.2;}
    40%{opacity:1;}
  }

  #composer{
    border-top:1px solid var(--line);
    padding:14px 0 20px;
    display:flex;
    gap:10px;
  }
  #composer textarea{
    flex:1;
    resize:none;
    font-family:var(--serif);
    font-size:15px;
    padding:11px 12px;
    border:1px solid var(--line);
    border-radius:2px;
    background:#fffdf7;
    color:var(--ink);
    min-height:46px;
    max-height:140px;
  }
  #composer textarea:focus{outline:none;border-color:var(--accent);}
  #composer button{
    font-family:var(--mono);
    font-size:12px;
    text-transform:uppercase;
    letter-spacing:.06em;
    background:var(--ink);
    color:var(--paper);
    border:none;
    padding:0 20px;
    border-radius:2px;
    cursor:pointer;
  }
  #composer button:hover{background:var(--accent);}
  #composer button:disabled{opacity:.4;cursor:default;}

  footer{
    text-align:center;
    font-family:var(--mono);
    font-size:10px;
    color:#a39c88;
    padding:10px 0 16px;
  }
</style>
</head>
<body>

<header>
  <div>
    <div class="mark">// interview_agent</div>
    <h1>Technical Mock Interview</h1>
  </div>
  <div id="status"><span class="dot"></span>not started</div>
</header>

<!-- Intake -->
<section id="intake">
  <p class="lead">This runs a mock technical interview based on your own coding background. Fill this in so the agent can quiz you on what you actually built, not generic trivia.</p>

  <div class="field">
    <label for="fName">Name</label>
    <input id="fName" type="text" placeholder="Jane Doe" />
  </div>

  <div class="field">
    <label for="fRole">Role you're prepping for</label>
    <input id="fRole" type="text" placeholder="Backend Engineer, Full-Stack, Data..." />
  </div>

  <div class="field">
    <label for="fStack">Tech stack / languages</label>
    <input id="fStack" type="text" placeholder="Python, FastAPI, PostgreSQL, React..." />
  </div>

  <div class="field">
    <label for="fBackground">Curriculum / projects to quiz you on</label>
    <textarea id="fBackground" placeholder="e.g. Completed a 12-week bootcamp covering Python, SQL, and REST APIs. Built a task-tracking app with FastAPI and Postgres, deployed on Vercel..."></textarea>
  </div>

  <div class="field">
    <label for="fApi">API base URL</label>
    <input id="fApi" type="text" value="https://interview-agent-coral-eta.vercel.app" />
  </div>

  <button id="startBtn">Start mock interview</button>
  <div id="intakeError"></div>
</section>

<!-- Chat -->
<div id="chatWrap">
  <div id="log"></div>
  <div id="composer">
    <textarea id="input" placeholder="Type your answer..." rows="1"></textarea>
    <button id="sendBtn">Send</button>
  </div>
</div>

<footer>session persists in this tab only · refresh to start over</footer>

<script>
(function(){
  const intake = document.getElementById('intake');
  const chatWrap = document.getElementById('chatWrap');
  const log = document.getElementById('log');
  const statusEl = document.getElementById('status');
  const startBtn = document.getElementById('startBtn');
  const intakeError = document.getElementById('intakeError');
  const input = document.getElementById('input');
  const sendBtn = document.getElementById('sendBtn');

  let sessionId = null;
  let apiBase = '';

  function setStatus(text, live){
    statusEl.innerHTML = '<span class="dot"></span>' + text;
    statusEl.className = live ? 'live' : '';
  }

  function addMsg(who, text){
    const wrap = document.createElement('div');
    wrap.className = 'msg ' + (who === 'agent' ? 'agent' : who === 'me' ? 'me' : 'sys');
    const label = document.createElement('div');
    label.className = 'who';
    label.textContent = who === 'agent' ? 'Interviewer' : who === 'me' ? 'You' : 'System';
    const bubble = document.createElement('div');
    bubble.className = 'bubble';
    bubble.textContent = text;
    wrap.appendChild(label);
    wrap.appendChild(bubble);
    log.appendChild(wrap);
    log.scrollTop = log.scrollHeight;
    return wrap;
  }

  function showTyping(){
    const wrap = document.createElement('div');
    wrap.className = 'msg agent';
    wrap.id = 'typingIndicator';
    wrap.innerHTML = '<div class="who">Interviewer</div><div class="typing">thinking<span class="dots"><span></span><span></span><span></span></span></div>';
    log.appendChild(wrap);
    log.scrollTop = log.scrollHeight;
  }
  function hideTyping(){
    const t = document.getElementById('typingIndicator');
    if(t) t.remove();
  }

  // Try to pull a question/message out of whatever shape the API returns
  function extractAgentText(data){
    if (typeof data === 'string') return data;
    if (!data || typeof data !== 'object') return JSON.stringify(data);
    const candidates = ['message','question','reply','response','text','output','content'];
    for (const key of candidates){
      if (typeof data[key] === 'string') return data[key];
    }
    // nested one level
    for (const key of Object.keys(data)){
      if (data[key] && typeof data[key] === 'object'){
        for (const k2 of candidates){
          if (typeof data[key][k2] === 'string') return data[key][k2];
        }
      }
    }
    return JSON.stringify(data, null, 2);
  }

  function genSessionId(){
    return 'sess-' + Math.random().toString(36).slice(2, 10) + Date.now().toString(36);
  }

  async function callInterview(body){
    const res = await fetch(apiBase.replace(/\/$/, '') + '/api/interview', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body)
    });
    const data = await res.json().catch(() => ({}));
    if (!res.ok){
      const detail = data && data.detail ? data.detail : ('Request failed (' + res.status + ')');
      throw new Error(detail);
    }
    return data;
  }

  startBtn.addEventListener('click', async () => {
    intakeError.style.display = 'none';
    const name = document.getElementById('fName').value.trim();
    const role = document.getElementById('fRole').value.trim();
    const stack = document.getElementById('fStack').value.trim();
    const background = document.getElementById('fBackground').value.trim();
    apiBase = document.getElementById('fApi').value.trim();

    if (!name || !apiBase){
      intakeError.textContent = 'Please enter at least your name and the API base URL.';
      intakeError.style.display = 'block';
      return;
    }

    sessionId = genSessionId();
    startBtn.disabled = true;
    startBtn.textContent = 'Starting mock interview…';

    try {
      const data = await callInterview({
        sessionId: sessionId,
        candidate: { name, role, stack, background }
      });
      intake.style.display = 'none';
      chatWrap.style.display = 'flex';
      setStatus('in progress', true);
      addMsg('agent', extractAgentText(data));
      input.focus();
    } catch(err){
      intakeError.textContent = 'Could not start interview: ' + err.message + '. Check the API base URL and candidate fields in models.py match what this form sends.';
      intakeError.style.display = 'block';
      startBtn.disabled = false;
      startBtn.textContent = 'Start mock interview';
    }
  });

  async function sendAnswer(){
    const text = input.value.trim();
    if (!text || !sessionId) return;
    addMsg('me', text);
    input.value = '';
    input.style.height = 'auto';
    sendBtn.disabled = true;
    showTyping();
    try {
      const data = await callInterview({ sessionId: sessionId, message: text });
      hideTyping();
      addMsg('agent', extractAgentText(data));
    } catch(err){
      hideTyping();
      addMsg('sys', 'Error: ' + err.message);
    } finally {
      sendBtn.disabled = false;
      input.focus();
    }
  }

  sendBtn.addEventListener('click', sendAnswer);
  input.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey){
      e.preventDefault();
      sendAnswer();
    }
  });
  input.addEventListener('input', () => {
    input.style.height = 'auto';
    input.style.height = Math.min(input.scrollHeight, 140) + 'px';
  });
})();
</script>
</body>
</html>
